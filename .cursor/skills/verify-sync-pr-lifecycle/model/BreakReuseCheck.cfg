\* Break: advance_sync_branch reuses the automation branch without checking that it contains upstream.
\* Root module: SyncPrLifecycleVariants.
SPECIFICATION Spec
CONSTANTS
    TargetBranch = "main"
    SyncBranch = "automation/upstream-sync"
    MaxUpstreamCommits = 2
    MaxForkCommits = 1
    MaxRuns = 4
    Reusable <- ReusableWithoutUpstreamCheck
INVARIANTS
    TypeOK
    NoFailedRun
    DefaultBranchNeverPushed
    ClosedPrNotReopenedUnchanged
    UpdatedRunLeavesOpenPrWithUpstream

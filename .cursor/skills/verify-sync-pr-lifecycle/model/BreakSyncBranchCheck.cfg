\* Break: ResolvedRepo without the sync_branch check, with settings.sync_branch set to
\* the fork's default branch.  Root module: SyncPrLifecycleVariants.
SPECIFICATION Spec
CONSTANTS
    TargetBranch = "main"
    SyncBranch = "main"
    MaxUpstreamCommits = 2
    MaxForkCommits = 1
    MaxRuns = 4
    SyncBranchIsTarget <- SyncBranchCheckDropped
INVARIANTS
    TypeOK
    NoFailedRun
    DefaultBranchNeverPushed
    ClosedPrNotReopenedUnchanged
    UpdatedRunLeavesOpenPrWithUpstream

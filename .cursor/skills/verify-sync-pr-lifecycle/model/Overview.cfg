\* Smaller bounds of SyncPrLifecycle.cfg, so that /statechart can draw the whole state graph.
SPECIFICATION Spec
CONSTANTS
    TargetBranch = "main"
    SyncBranch = "automation/upstream-sync"
    MaxUpstreamCommits = 1
    MaxForkCommits = 0
    MaxRuns = 3
INVARIANTS
    TypeOK
    NoFailedRun
    DefaultBranchNeverPushed
    ClosedPrNotReopenedUnchanged
    UpdatedRunLeavesOpenPrWithUpstream

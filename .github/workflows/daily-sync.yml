name: Daily Upstream Sync

on:
  schedule:
    # 每天 03:17 UTC；可按需修改。
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: fork-sync-manager
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout manager
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync configured forks
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          FORK_SYNC_DEV_BRANCH: ${{ vars.FORK_SYNC_DEV_BRANCH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/sync.py
